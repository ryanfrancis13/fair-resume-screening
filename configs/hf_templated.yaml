# Real-world Hugging Face dataset augmented with ALL 9 cue families!
#
# Contains 643 unique resumes, 351 unique jobs, and 8,000 real application pairs
# with human recruiter labels (Good Fit / Potential Fit / No Fit).
# Every resume has standardized slots, enabling exact counterfactual substitution
# across all 9 cue families with zero regex corruption.

run_name: hf_templated
seed: 20250831
output_dir: runs
log_level: INFO

llm:
  provider: gemini
  model: gemini-3.6-flash
  temperature: 0.0
  self_consistency_samples: 3
  self_consistency_temperature: 0.4
  requests_per_minute: 10
  max_concurrency: 4
  cache_enabled: true
  cache_dir: .frs_cache

data:
  corpus: sample
  resumes_path: data/hf_templated/resumes
  jobs_path: data/hf_templated/jobs
  pairs_path: data/hf_templated/pairs.json
  max_resumes: 12
  max_jobs: 6

screening:
  rubric: default
  require_evidence: true
  advance_threshold: 70.0
  borderline_threshold: 55.0

perturbation:
  cue_families:
    - name
    - pronoun
    - affiliation_marker
    - cultural_marker
    - location_marker
    - age_marker
    - socioeconomic_marker
    - education_prestige
    - writing_register
  name_list: bertrand_mullainathan_2004
  design: single
  validate_variants: true

fairness:
  attributes: [gender, race_ethnicity, nationality_region, age_band, disability_status, socioeconomic_background]

mitigation:
  strategies:
    - blind_screening
    - counterfactual_marginalization
    - sensitivity_gated_review

# Small real-model smoke test.
#
# This configuration verifies Gemini connectivity, response parsing, caching,
# and artifact generation without running the full fairness study.

run_name: gemini_smoke
seed: 20250831
output_dir: runs
log_level: INFO

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0.0
  self_consistency_samples: 1
  # Keep below the typical free-tier per-minute quota.
  requests_per_minute: 1
  max_concurrency: 1
  max_retries: 0
  cache_enabled: true
  cache_dir: .frs_cache

data:
  corpus: sample
  resumes_path: data/sample/resumes
  jobs_path: data/sample/jobs
  pairs_path: data/sample/pairs.json
  max_resumes: 1
  max_jobs: 1
  max_resume_chars: 12000
  max_job_chars: 6000

perturbation:
  cue_families:
    - education_prestige
  levels_per_family: 1
  design: single
  validate_variants: true

fairness:
  bootstrap_iterations: 200
  permutation_iterations: 200

mitigation:
  strategies: []

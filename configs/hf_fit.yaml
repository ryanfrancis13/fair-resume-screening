# Real-world dataset run: cnamuangtoun/resume-job-description-fit (Hugging Face).
#
# 642 unique resumes, 280 unique job descriptions, real Good/Potential/No Fit
# labels. Run scripts/fetch_hf_fit_dataset.py first to populate data/raw/.
#
# Perturbation is limited to cues detectable by regex on unstructured real
# text (like the kaggle config) — this data has no slot templates, so
# hobbies/funding-note/writing-register style cues aren't reliably injectable.

run_name: hf_fit
seed: 20250831
output_dir: runs
log_level: INFO

llm:
  provider: gemini
  model: gemini-3.6-flash
  temperature: 0.0
  self_consistency_samples: 3
  self_consistency_temperature: 0.4
  requests_per_minute: 10 # match free-tier cap exactly; raise if billing is enabled
  cache_enabled: true

data:
  corpus: hf_fit
  hf_fit_train_csv: data/raw/hf_fit_train.csv
  hf_fit_test_csv: data/raw/hf_fit_test.csv
  hf_fit_use_test_split: false # start with train.csv only; flip on for a larger run later
  max_resumes: 60 # caps pairs, not unique resumes — keep the first real run small and cheap
  max_resume_chars: 12000
  max_job_chars: 6000

perturbation:
  cue_families:
    - name
    - pronoun
    - location_marker
    - age_marker

screening:
  rubric: default
  require_evidence: true
  advance_threshold: 70.0
  borderline_threshold: 55.0

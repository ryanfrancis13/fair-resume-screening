# Real public corpus instead of the synthetic sample.
#
#   1. Download the Kaggle "Resume Dataset" (UpdatedResumeDataSet.csv) into data/raw/
#      https://www.kaggle.com/datasets/gauravduttakiit/resume-dataset
#   2. frs pipeline --config configs/kaggle.yaml
#
# These resumes ship no templates, so the perturbation layer falls back to regex
# slot *detection*. Detection is fallible, which means the content-preservation
# validator is doing real work here — expect a pass rate below 100% and read
# variants/skipped.json to see which resumes could not carry which cue. Those
# exclusions are reported rather than hidden, because dropping them silently would
# bias the design toward resumes with tidy headers.

run_name: kaggle
seed: 20250831

data:
  corpus: kaggle
  kaggle_csv: data/raw/UpdatedResumeDataSet.csv
  max_resumes: 40          # stratified across job categories, not the first 40 rows
  max_resume_chars: 12000

perturbation:
  # Only families whose slots can be detected in unstructured text. The template-only
  # families (affiliation, cultural activity, hobbies, funding) are omitted because
  # they cannot be located reliably, and a mis-placed edit is worse than a missing one.
  cue_families:
    - name
    - location_marker
    - age_marker
  name_list: bertrand_mullainathan_2004
  design: single
  validate_variants: true

fairness:
  attributes: [gender, race_ethnicity, nationality_region, age_band]

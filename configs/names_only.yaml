# The classic replication: names only.
#
#   frs pipeline --config configs/names_only.yaml
#
# Reproduces the Bertrand & Mullainathan (2004) design as applied to an LLM
# screener, and nothing else. Run this first — it is the smallest defensible
# experiment and the one with a peer-reviewed name list behind it. Then run
# configs/full_cues.yaml and compare: the difference between the two is the
# project's contribution.

run_name: names_only
seed: 20250831

perturbation:
  cue_families:
    - name
    - education_prestige     # keep the validity probe so a null result stays interpretable
  name_list: bertrand_mullainathan_2004
  design: single

fairness:
  attributes: [gender, race_ethnicity]
  reference_levels:
    gender: male
    race_ethnicity: White
  intersectional_attributes: [gender, race_ethnicity]

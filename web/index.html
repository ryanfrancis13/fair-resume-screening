<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate Evaluation Studio</title>
    <link rel="stylesheet" href="/assets/styles.css?v=6">
  </head>
  <body>
    <div class="ambient-bg" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Structured Rubric Assessment</p>
          <h1>Resume Screening &amp; Candidate Evaluation</h1>
          <p class="lede">Evaluate candidate alignment across six rubric dimensions with verbatim resume evidence verification.</p>
        </div>
      </header>

      <section class="panel form-panel">
        <form id="screen-form" action="/api/screen" method="POST" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="resume" class="field-label">Candidate Resume</label>
              <div class="upload-wrapper">
                <input id="resume" name="resume" type="file" class="visually-hidden" accept=".txt,.md,.pdf,.docx" aria-describedby="upload-detail" required>
                <label for="resume" class="upload" id="upload-box">
                  <span class="upload-icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <polyline points="14 2 14 8 20 8"></polyline>
                      <line x1="12" y1="18" x2="12" y2="12"></line>
                      <polyline points="9 15 12 12 15 15"></polyline>
                    </svg>
                  </span>
                  <strong id="upload-title">Drop resume file here or click to browse</strong>
                  <span id="upload-detail">PDF, DOCX, TXT, or Markdown up to 5 MB</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="job-description" class="field-label">Job Description</label>
                <span id="jd-hint" class="field-hint">Min 40 characters</span>
              </div>
              <textarea
                id="job-description"
                name="job_description"
                minlength="40"
                aria-describedby="jd-hint"
                required
                placeholder="Paste the role summary, core responsibilities, required technical qualifications, and preferred skills..."
              ></textarea>
            </div>
          </div>

          <div class="form-footer">
            <p class="form-error hidden" id="form-error" role="alert"></p>
            <button class="primary" id="submit-button" type="submit">
              <span>Evaluate Candidate</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </section>

      <section class="result-stack hidden" id="result" aria-live="polite"></section>
    </main>
    <script src="/assets/app.js?v=6"></script>
  </body>
</html>

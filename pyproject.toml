[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-resume-screening"
version = "1.0.0"
description = "Generative AI-powered resume screening with counterfactual fairness assessment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "python-dotenv>=1.0",
  "google-genai>=1.0.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.scripts]
frs = "frs.cli:main"

[dependency-groups]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "httpx>=0.27",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "frs" = "src" }
packages = ["frs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
